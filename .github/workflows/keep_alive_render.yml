name: Keep-Alive Render Bot 24/7

on:
  schedule:
    # Ping cada 10 minutos para evitar que Render Free se duerma y reinicie SQLite
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping al servidor Render
        run: |
          curl -fsS --max-time 30 https://radar-alertas-bot-du2p.onrender.com/ping
          echo ""
